pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Required by the OpenDroid runtime dependencies.
        maven { url = 'https://jitpack.io' }
    }
}

rootProject.name = "OpenJarvis"
include ':app'